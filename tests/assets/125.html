<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font: 16px sans-serif;
      background: #eef2f7;
      color: #1e293b;
      padding: 24px;
    }

    h2 {
      font-size: 16px;
      margin: 18px 0 8px;
    }

    /* A colorful background behind the panels */
    .scene {
      position: relative;
      width: 480px;
      height: 150px;
      background: linear-gradient(90deg, #ef4444, #f59e0b, #22c55e, #3b82f6, #a855f7);
    }

    .scene .stripe {
      position: absolute;
      left: 0;
      right: 0;
      top: 60px;
      height: 30px;
      background: repeating-linear-gradient(90deg, #0f172a 0 12px, #ffffff 12px 24px);
    }

    .glass {
      position: absolute;
      top: 20px;
      width: 120px;
      height: 110px;
      padding: 8px;
      box-sizing: border-box;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: #0f172a;
      font-weight: bold;
    }

    .a {
      left: 20px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: grayscale(1);
    }

    .b {
      left: 180px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: sepia(1) brightness(1.2);
    }

    /* blur() then invert(), in order */
    .c {
      left: 340px;
      color: white;
      backdrop-filter: blur(8px) invert(1);
    }
  </style>
</head>

<body>
  <h1>backdrop-filter</h1>

  <h2>Panels over a gradient</h2>
  <div class="scene">
    <div class="stripe"></div>
    <div class="glass a">grayscale</div>
    <div class="glass b">sepia + brightness</div>
    <div class="glass c">blur + invert</div>
  </div>
</body>

</html>
