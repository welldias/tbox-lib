<!DOCTYPE html>
<html>

<body>

    <h2>HTML Image</h2>
    <img src="black.png" alt="Width and height attributes" width="100" height="100">
    <img src="yellow.png" alt="Yellow square at its natural size">
    <img src="notfound.png" alt="Image not found">
    <a href="https://www.google.com/">
        <img src="black.png" alt="Go to Google" style="width:42px;height:42px;">
    </a>

    <p><img src="bird.png" alt="Bird and flower" style="width:240px;height:160px;"></p>

    <p><img src="yellow.png" alt="Yellow floating" style="float:right;width:42px;height:42px;">
        The image will float to the right of the text.</p>

    <p><img src="black.png" alt="Black floating" style="float:left;width:42px;height:42px;">
        The image will float to the left of the text.</p>

</body>

</html>
