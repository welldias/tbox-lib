<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font: 16px sans-serif;
      background: #eef2f7;
      color: #1e293b;
      padding: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .row {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
    }

    .box {
      width: 150px;
      height: 90px;
      background: #60a5fa;
      color: white;
      padding: 8px;
    }

    .a {
      border-radius: 40px / 20px;
    }

    .b {
      border-radius: 50%;
      background: #f472b6;
    }

    .c {
      border-radius: 10px 60px / 40px 10px;
      border: 4px solid #1e3a8a;
    }

    .d {
      border-top-left-radius: 70px 30px;
      border-bottom-right-radius: 30px 70px;
      background: #34d399;
    }

    .e {
      border-radius: 30px / 45px;
      border: 6px solid #f59e0b;
      background: #fff7ed;
      color: #92400e;
    }

    .f {
      border-radius: 100% 0 / 100% 0;
      background: #a78bfa;
    }
  </style>
</head>

<body>
  <h1>border-radius eliptico (horizontal / vertical)</h1>
  <div class="row">
    <div class="box a">40px / 20px</div>
    <div class="box b">50% (elipse)</div>
    <div class="box c">10px 60px / 40px 10px</div>
  </div>
  <div class="row">
    <div class="box d">cantos longhand</div>
    <div class="box e">com borda</div>
    <div class="box f">100% 0 / 100% 0</div>
  </div>
</body>

</html>
