<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <style>
    /* <textarea> line breaking (docs/10-formularios-e-controles.md):
     * it breaks after spaces, which hang at the end of the line; only a
     * word wider than the line is cut. The text's own line breaks are
     * kept. */
    body {
      margin: 24px;
      background: #f4f7fb;
      color: #263548;
      font-size: 16px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    section {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 14px 18px;
      margin: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }


    h2 {
      font-size: 17px;
      margin: 0 0 10px;
    }

    textarea {
      width: 220px;
      height: 96px;
      font-size: 16px;
    }

    .narrow {
      width: 120px;
    }
  </style>
</head>

<body>
  <h1>Line breaking in textarea</h1>
  <div class="grid">

  <section>
    <h2>Plain sentence</h2>
    <textarea>Or this one, in a text area that has to wrap between the words.</textarea>
  </section>

  <section>
    <h2>Repeated spaces and the text's own breaks</h2>
    <textarea>Several     spaces     in a row
Second line
Third</textarea>
  </section>

  <section>
    <h2>Word longer than the line</h2>
    <textarea class="narrow">See https://example.com/a/very/long/path here</textarea>
  </section>
  </div>
</body>

</html>
