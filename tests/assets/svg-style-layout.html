<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box} body{margin:20px;background:#fff;color:#24304a;font:14px/20px Arial,sans-serif}h1{font-size:20px;line-height:28px;margin:0 0 12px}p{margin:8px 0 12px}svg{display:block} .row{display:flex;gap:20px;margin-bottom:16px;align-items:center} .frame{border:1px solid #cbd2df;background:#f5f7fb} .blue{color:#3978cf} .purple{color:#7866de} .gold{color:#dca32f}
</style></head><body><h1>SVG CSS cascade and HTML layout</h1><p>Presentation attributes, author rules, variables, inherited paint and percentage size.</p>
<style>
:root{--ink:#7866de} .panel{width:320px;height:150px;background:#f5f7fb;border:1px solid #cbd2df} .panel svg{width:100%;height:100%} .paint{fill:var(--ink);stroke:#24304a;stroke-width:2} .reset{fill:initial;stroke:none} .inherit{fill:inherit} @layer theme{.layer{fill:#38a87b}} .grid{display:grid;grid-template-columns:90px 90px 90px;gap:12px;margin-top:16px} .grid svg{width:60px;height:50px} .inline{margin-top:18px;font:16px/40px Arial,sans-serif}.inline svg{display:inline;width:24px;height:24px;vertical-align:middle;color:#3978cf}
</style>
<div class="row"><div class="panel"><svg viewBox="0 0 160 75"><g fill="#dca32f"><rect class="paint" x="5" y="5" width="40" height="60" fill="red"/><rect class="inherit" x="55" y="5" width="40" height="60" fill="red"/><rect class="layer" x="105" y="5" width="40" height="60" fill="red"/></g></svg></div>
<div class="panel"><svg viewBox="0 0 160 75"><g fill="#dca32f"><rect class="reset" x="5" y="5" width="40" height="60"/><rect x="55" y="5" width="40" height="60" fill-opacity=".3"/><rect x="105" y="5" width="40" height="60" opacity=".6" fill="#3978cf" stroke="#24304a" stroke-width="6"/></g></svg></div></div>
<div class="grid"><svg viewBox="0 0 12 10"><rect width="12" height="10" fill="#3978cf"/></svg><svg viewBox="0 0 12 10"><circle cx="6" cy="5" r="5" fill="#7866de"/></svg><svg viewBox="0 0 12 10"><path d="M0 10 6 0 12 10Z" fill="#38a87b"/></svg></div>
<p class="inline">Before <svg viewBox="0 0 24 24"><path d="M3 5h7l2 2h9v13H3Z" fill="currentColor"/></svg> after the inline icon.</p></body></html>
