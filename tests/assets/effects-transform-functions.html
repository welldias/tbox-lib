<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <style>
    /* 2D transforms (docs/08-layout-e-pintura.md, "Transformações"):
     * rotate(), scale(), skewX(), matrix(), transform-origin, the
     * individual rotate/scale properties, translate+rotate composition and
     * the flattened 3D functions (rotateZ = rotate; rotateX without
     * perspective only shrinks the height). Each box is 100x60 with a border
     * and one word; the transformed box is drawn whole (background, border,
     * text). */
    body {
      margin: 0;
      padding: 10px;
      background: white;
      font-family: sans-serif;
    }

    .grade {
      display: flex;
      flex-wrap: wrap;
      width: 780px;
    }

    .cell {
      width: 260px;
      height: 190px;
    }

    .label {
      margin: 0;
      height: 20px;
      font-size: 13px;
      color: #333333;
    }

    .box {
      width: 94px;
      height: 54px;
      margin: 45px 0 0 80px;
      border: 3px solid #1a1a1a;
      font-size: 18px;
      line-height: 54px;
      text-align: center;
      color: white;
    }

    .a { background: #d62828; transform: rotate(30deg); }
    .b { background: #1d6fd6; transform: scale(1.3, 0.7); }
    .c { background: #2a9d3a; transform: skewX(20deg); }
    .d { background: #8a2be2; transform: matrix(0.8, 0.3, -0.3, 0.8, 10, 0); }
    .e { background: #e07b00; transform-origin: top left; transform: rotate(20deg); }
    .f { background: #008b8b; rotate: 25deg; scale: 0.8 1.2; }
    .g { background: #c2185b; transform: translate(20px, 10px) rotate(-30deg); }
    .h { background: #5d4037; transform: rotateZ(45deg); }
    .i { background: #37474f; transform: rotateX(60deg); }
  </style>
</head>

<body>
  <div class="grade">
    <div class="cell"><p class="label">rotate(30deg)</p><div class="box a">Ab</div></div>
    <div class="cell"><p class="label">scale(1.3, 0.7)</p><div class="box b">Ab</div></div>
    <div class="cell"><p class="label">skewX(20deg)</p><div class="box c">Ab</div></div>
    <div class="cell"><p class="label">matrix(...)</p><div class="box d">Ab</div></div>
    <div class="cell"><p class="label">origin top left</p><div class="box e">Ab</div></div>
    <div class="cell"><p class="label">rotate + scale</p><div class="box f">Ab</div></div>
    <div class="cell"><p class="label">translate rotate</p><div class="box g">Ab</div></div>
    <div class="cell"><p class="label">rotateZ(45deg)</p><div class="box h">Ab</div></div>
    <div class="cell"><p class="label">rotateX(60deg)</p><div class="box i">Ab</div></div>
  </div>
</body>

</html>
