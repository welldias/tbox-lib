<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font: 16px sans-serif;
            background: #eef2f7;
            color: #1e293b;
            padding: 24px;
        }

        .card {
            width: 320px;
            padding: 18px;
            background: white;
            border: 2px solid #94a3b8;
        }

        .card:hover {
            background: #dbeafe;
            border-color: #2563eb;
        }

        .inner {
            padding: 20px;
            background: #bbf7d0;
        }

        .inner:hover {
            background: #86efac;
        }
    </style>
</head>

<body>
    <h1>:hover on ancestors</h1>
    <p>Hover the green area: it and the card change color.</p>
    <div class="card">
        <p>Ancestor card</p>
        <div class="inner">Inner area</div>
    </div>
</body>

</html>
