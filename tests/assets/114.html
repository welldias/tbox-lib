<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <style>
        body {
            margin: 24px;
            background: #f4f7fb;
            color: #263548;
            font-size: 20px;
        }

        p {
            margin: 28px 0;
        }

        ruby {
            color: #274876;
        }

        rt {
            color: #a03428;
        }
    </style>
</head>

<body>
    <h1>Ruby annotations</h1>
    <p>Pronunciation: <ruby>bonjour<rp>(</rp>
            <rt>bohn-ZHOOR</rt>
            <rp>)</rp>
        </ruby> on one line.</p>
    <p>Two segments: <ruby>A<rt>alpha</rt>B<rt>beta</rt></ruby> side by side.</p>
    <p>No annotation: <ruby>base</ruby>.</p>
</body>

</html>
