<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font: 16px sans-serif;
      background: #eef2f7;
      color: #1e293b;
      padding: 24px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    h2 {
      font-size: 16px;
      margin: 16px 0 8px;
    }

    p.note {
      margin: 0 0 12px;
      color: #475569;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      width: 750px;
    }

    .c {
      width: 140px;
      height: 50px;
      background: white;
      border: 2px solid #94a3b8;
      font-size: 13px;
      padding: 4px;
      box-sizing: border-box;
    }

    .pointer {
      cursor: pointer;
    }

    .text {
      cursor: text;
    }

    .move {
      cursor: move;
    }

    .wait {
      cursor: wait;
    }

    .help {
      cursor: help;
    }

    .cross {
      cursor: crosshair;
    }

    .na {
      cursor: not-allowed;
      background: #fee2e2;
    }

    .grab {
      cursor: grab;
    }

    .ew {
      cursor: ew-resize;
    }

    .ns {
      cursor: ns-resize;
    }

    .none {
      cursor: none;
    }

    .fallback {
      cursor: url(cursor.cur) 4 4, progress;
    }

    .nosel {
      user-select: none;
      background: #f1f5f9;
    }
    .copy {
      cursor: copy;
    }

    .zoom-in {
      cursor: zoom-in;
    }

    .zoom-out {
      cursor: zoom-out;
    }

    .row {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    button {
      box-sizing: border-box;
      width: 222px;
      height: 42px;
      padding: 0;
      border: 1px solid #334155;
      font: 13px sans-serif;
      background: #b7d6ed;
      color: #172033;
      cursor: pointer;
    }

    button:hover {
      background: #72bce9;
    }

    button:active {
      background: #f97316;
      color: white;
      border-color: #9a3412;
    }

    /* pointer-events: none lets the hover reach the button under the tinted layer. */
    .target {
      width: 222px;
      height: 42px;
      position: relative;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 222px;
      height: 42px;
      box-sizing: border-box;
      background: rgba(240, 180, 80, 0.35);
      border: 1px solid #bf8641;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <h1>cursor, user-select, pointer-events and :active</h1>
  <p class="note">Hover each box in the tbox_app_demo window.</p>
  <div class="grid">
    <div class="c pointer">pointer</div>
    <div class="c text">text</div>
    <div class="c move">move</div>
    <div class="c wait">wait</div>
    <div class="c help">help</div>
    <div class="c cross">crosshair</div>
    <div class="c na">not-allowed</div>
    <div class="c grab">grab</div>
    <div class="c ew">ew-resize</div>
    <div class="c ns">ns-resize</div>
    <div class="c none">none</div>
    <div class="c fallback">url(), progress</div>
    <div class="c copy">copy</div>
    <div class="c zoom-in">zoom-in</div>
    <div class="c zoom-out">zoom-out</div>
    <div class="c nosel">user-select: none</div>
    <div class="c"><a href="#">link: pointer</a></div>
  </div>

  <h2>pointer-events: none and :active</h2>
  <div class="row">
    <div class="target">
      <button>Button under overlay</button>
      <div class="overlay"></div>
    </div>
    <button>Hold for :active</button>
  </div>
</body>

</html>
