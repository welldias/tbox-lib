<!DOCTYPE html>
<html>

<head>
    <style>
        .v-radius-plain {
            width: 150px;
            height: 90px;
            margin: 16px;
            background-color: tomato;
            border-radius: 20px;
        }

        .v-radius-border {
            width: 150px;
            height: 90px;
            margin: 16px;
            background-color: dodgerblue;
            border: 6px solid navy;
            border-radius: 24px;
        }

        .v-radius-border-shadow {
            width: 150px;
            height: 90px;
            margin: 16px;
            background-color: white;
            border: 6px solid navy;
            border-radius: 24px;
            box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.5);
        }

        .v-radius-pill-shadow {
            width: 150px;
            height: 90px;
            margin: 16px;
            background-color: mediumseagreen;
            border-radius: 45px;
            box-shadow: 0px 6px 0px rgba(0, 0, 0, 0.6);
        }

        .v-radius-circle {
            width: 100px;
            height: 100px;
            margin: 16px;
            background-color: orange;
            border-radius: 1000px;
        }
    </style>
</head>

<body>

    <div class="v-radius-shadow-container">
        <div class="v-radius-plain"></div>
        <div class="v-radius-border"></div>
        <div class="v-radius-border-shadow"></div>
        <div class="v-radius-pill-shadow"></div>
        <div class="v-radius-circle"></div>
    </div>

</body>

</html>
