<!DOCTYPE html>
<html><head><style>
body { font: 16px sans-serif; background: #eef2f7; color: #1e293b; padding: 24px; }
.box { padding: 12px; margin: 12px 0; background: #bfdbfe; }
.minimum { inline-size: 60px; min-inline-size: 260px; min-block-size: 75px; }
.maximum { inline-size: 420px; max-inline-size: 240px; block-size: 100px; max-block-size: 50px; background: #bbf7d0; }
</style></head><body>
<h1>Limites logicos de tamanho</h1>
<div class="box minimum">Minimo: 260 x 75</div>
<div class="box maximum">Maximo: 240 x 50</div>
</body></html>
