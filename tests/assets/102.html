<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font: 16px sans-serif;
            background: #eef2f7;
            color: #1e293b;
            padding: 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        p {
            width: 190px;
            background: white;
            border: 1px solid #94a3b8;
            padding: 6px;
            margin: 0 16px 12px 0;
            display: inline-block;
            vertical-align: top;
        }

        .none {
            hyphens: none;
        }
    </style>
</head>

<body>
    <h1>Manual hyphenation (&amp;shy;) and hyphens</h1>
    <p>hyphens: manual (default) breaks extra&shy;or&shy;di&shy;nar&shy;i&shy;ly long&shy;er words with a hy&shy;phen</p>
    <p class="none">hyphens: none ignores the break points extra&shy;or&shy;di&shy;nar&shy;i&shy;ly</p>
</body>

</html>
