<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box} body{margin:20px;background:#fff;color:#24304a;font:14px/20px Arial,sans-serif}h1{font-size:20px;line-height:28px;margin:0 0 12px}p{margin:8px 0 12px}svg{display:block} .row{display:flex;gap:20px;margin-bottom:16px;align-items:center} .frame{border:1px solid #cbd2df;background:#f5f7fb} .blue{color:#3978cf} .purple{color:#7866de} .gold{color:#dca32f}
</style></head><body><h1>SVG basic shapes and viewport</h1><p>Solid paint, rounded corners, ellipse, percentages, viewBox alignment.</p>
<svg class="frame" width="740" height="220" viewBox="0 0 740 220">
<rect x="20" y="20" width="90" height="65" fill="#3978cf"/>
<rect x="130" y="20" width="100" height="65" rx="18" fill="#7866de"/>
<rect x="250" y="20" width="100" height="65" rx="25" ry="8" fill="#dca32f"/>
<circle cx="410" cy="55" r="34" fill="#38a87b"/>
<ellipse cx="520" cy="55" rx="48" ry="28" fill="#cf5967"/>
<circle cx="660" cy="55" r="32" fill="none" stroke="#3978cf" stroke-width="5"/>
<line x1="25" y1="130" x2="110" y2="185" stroke="#7866de" stroke-width="6"/>
<polyline points="140,180 180,120 220,180" fill="none" stroke="#3978cf" stroke-width="6" stroke-linejoin="round"/>
<polygon points="260,180 300,120 340,180" fill="#38a87b"/>
<rect x="52%" y="55%" width="18%" height="30%" rx="10" fill="#7866de"/>
<svg x="580" y="120" width="120" height="70" viewBox="0 0 50 50"><circle cx="25" cy="25" r="25" fill="#dca32f"/></svg>
</svg><p>Centered meet / none / aligned slice.</p><div class="row">
<svg class="frame" width="160" height="100" viewBox="0 0 40 40"><rect width="40" height="40" fill="#3978cf"/><circle cx="20" cy="20" r="15" fill="#dca32f"/></svg>
<svg class="frame" width="160" height="100" viewBox="0 0 40 40" preserveAspectRatio="none"><rect width="40" height="40" fill="#3978cf"/><circle cx="20" cy="20" r="15" fill="#dca32f"/></svg>
<svg class="frame" width="160" height="100" viewBox="0 0 40 40" preserveAspectRatio="xMaxYMin slice"><rect width="40" height="40" fill="#3978cf"/><circle cx="20" cy="20" r="15" fill="#dca32f"/></svg></div></body></html>
