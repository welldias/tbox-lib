<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #eef2f7;
            color: #1e293b;
            font: 16px sans-serif;
            padding: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .card {
            width: 350px;
            padding: 14px;
            background: white;
            border: 1px solid #cbd5e1;
        }

        a {
            display: block;
            padding: 8px;
            margin: 0 0 5px;
            background: #e2e8f0;
        }

        a:link {
            color: #1d4ed8;
        }

        a:any-link {
            border-left: 5px solid #2563eb;
            background: #dbeafe;
        }
    </style>
</head>

<body>
    <h1>:link e :any-link</h1>
    <div class="card">
        <a href="https://example.org/one">Com href: azul e borda</a>
        <a>Sem href: cinza</a>
        <a href="https://example.org/two">Outro link: azul e borda</a>
    </div>
</body>

</html>
