<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <title>Recortes poligonais</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font: 16px sans-serif;
            color: #172033;
            background: #edf1f7;
        }

        h1 {
            font-size: 24px;
        }

        h2 {
            font-size: 17px;
            margin: 20px 0 8px;
        }

        p {
            margin: 8px 0;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .tile {
            width: 240px;
            height: 140px;
            background: linear-gradient(45deg, #2563eb, #10b981);
        }

        .triangle {
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
        }

        .concave {
            clip-path: polygon(0 0, 100% 0, 100% 30%, 30% 30%, 30% 100%, 0 100%);
        }

        .star {
            clip-path: polygon(nonzero, 50% 0, 80% 100%, 0 38%, 100% 38%, 20% 100%);
        }

        .star-hole {
            clip-path: polygon(evenodd, 50% 0, 80% 100%, 0 38%, 100% 38%, 20% 100%);
        }

        .parent {
            clip-path: polygon(0 0, 100% 0, 0 100%);
            background: none;
        }

        .child {
            width: 100%;
            height: 100%;
            background: #ef4444;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        .filtered {
            clip-path: polygon(calc(50% - 10px) 0, 100% 100%, 0 100%);
            filter: blur(3px);
            opacity: .75;
            border-radius: 15px;
        }
    </style>
</head>

<body>
    <h1>Recortes poligonais</h1>
    <p>Recorte do elemento e dos descendentes, inclusive para eventos do ponteiro.</p>
    <h2>Triângulo e polígono côncavo</h2>
    <div class="row">
        <div class="tile triangle"></div>
        <div class="tile concave"></div>
    </div>
    <h2>Mesma estrela: nonzero e evenodd (centro vazado)</h2>
    <div class="row">
        <div class="tile star"></div>
        <div class="tile star-hole"></div>
    </div>
    <h2>Interseção de polígonos aninhados e recorte depois do blur</h2>
    <div class="row">
        <div class="tile parent">
            <div class="child"></div>
        </div>
        <div class="tile filtered"></div>
    </div>
</body>

</html>
