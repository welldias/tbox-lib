<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <style>
    body {
      margin: 24px;
    }

    img {
      width: 300px;
      height: 300px;
    }
  </style>
</head>

<body>
  <h1>Image regions</h1>
  <p>Hover the regions: left, circle at the top right and triangle below.</p>
  <img src="yellow.png" alt="Image map" usemap="#regioes">
  <map name="regioes">
    <area shape="rect" coords="0,0,100,200" href="#esquerda" alt="Left">
    <area shape="circle" coords="150,50,40" href="#circulo" alt="Circle">
    <area shape="poly" coords="110,110,190,110,150,190" href="#triangulo" alt="Triangle">
  </map>
  <p>The areas can be handled with click callbacks registered by the application.</p>
</body>

</html>
