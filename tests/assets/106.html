<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <style>
    body {
      margin: 24px;
      background: #f4f7fb;
      color: #263548;
      font-size: 18px;
    }

    h1 {
      font-size: 28px;
      margin: 0 0 18px;
    }

    section {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 18px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 12px;
    }

    p {
      margin: 8px 0;
    }

    progress,
    meter {
      width: 260px;
      height: 18px;
    }

    output {
      font-weight: bold;
      color: #245ab4;
    }
  </style>
</head>

<body>
  <h1>Indicators and output</h1>
  <section>
    <h2>Progress of a task</h2>
    <p>Download: <output>65%</output></p>
    <progress value="65" max="100">65% done</progress>
    <p>Waiting for a step without a percentage:</p>
    <progress>Waiting</progress>
  </section>
  <section>
    <h2>Measurement on a scale</h2>
    <p>Ideal range: 40 to 70, on a scale of 0 to 100.</p>
    <p>Good: <meter min="0" max="100" low="40" high="70" optimum="55" value="55">55</meter></p>
    <p>Warning: <meter min="0" max="100" low="40" high="70" optimum="55" value="85">85</meter></p>
  </section>
</body>

</html>
