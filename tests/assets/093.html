<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font: 15px sans-serif;
            background: #eef2f7;
            color: #1e293b;
            padding: 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        .root {
            display: flow-root;
            background: white;
            border: 2px solid #94a3b8;
            padding: 8px;
            margin-bottom: 12px;
        }

        .steps {
            padding-left: 30px;
        }

        .steps div {
            display: list-item;
            margin: 4px 0;
        }

        .squares span {
            display: list-item;
            list-style-type: square;
            margin-left: 24px;
        }

        .roman p {
            display: list-item;
            list-style: upper-roman inside;
            margin: 2px 0;
        }
    </style>
</head>

<body>
    <h1>display: flow-root and list-item</h1>
    <div class="root">flow-root behaves like a block</div>
    <div class="root steps">
        <div>div with display list-item</div>
        <div>second item</div>
        <div>third item</div>
    </div>
    <div class="root squares"><span>span as a square list-item</span><span>another</span></div>
    <div class="root roman">
        <p>paragraph as an inside roman item</p>
        <p>second</p>
    </div>
</body>

</html>
