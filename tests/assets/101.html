<!DOCTYPE html>
<html><head><style>
body { font: 40px serif; background: #eef2f7; color: #1e293b; padding: 24px; }
h1 { margin: 0 0 12px; font: bold 24px sans-serif; }
p { margin: 0 0 6px; background: white; display: inline-block; }
.none { font-kerning: none; }
.auto { font-kerning: auto; }
small { font: 13px sans-serif; display: block; margin-bottom: 14px; }
</style></head><body>
<h1>font-kerning</h1>
<p class="auto">AVATAR Tower WAVE To</p><small>font-kerning: auto (padrao) aproxima pares como AV, To, Wa</small>
<p class="none">AVATAR Tower WAVE To</p><small>font-kerning: none usa so os avancos dos glifos</small>
</body></html>
