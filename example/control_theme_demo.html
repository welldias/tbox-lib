<!DOCTYPE html>
<html>
<body>
  <h1>Temas para caixas de controles</h1>
  <p>Clique em cada campo para abrir a caixa personalizada. Use Tab e Enter para testar pelo teclado.</p>
  <p>O segundo campo de cor tem uma regra propria por id. As escolhas aparecem no terminal.</p>

  <p class="field"><label for="primary-color">Cor principal</label><input id="primary-color" type="color" value="#24bda0"></p>
  <p class="field"><label for="secondary-color">Cor secundaria</label><input id="secondary-color" type="color" value="#b96ac8"></p>
  <p class="field"><label for="event-date">Data</label><input id="event-date" type="date" value="2026-09-28"></p>
  <p class="field"><label for="event-datetime">Data e hora</label><input id="event-datetime" type="datetime-local" value="2026-09-28T14:30"></p>
  <p class="field"><label for="event-month">Mes</label><input id="event-month" type="month" value="2026-09"></p>
  <p class="field"><label for="event-time">Hora</label><input id="event-time" type="time" value="14:30"></p>
  <p class="field"><label for="event-week">Semana</label><input id="event-week" type="week" value="2026-W40"></p>
  <p class="field"><label for="attachment">Arquivo</label><input id="attachment" type="file"></p>
</body>
</html>
