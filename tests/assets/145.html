<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <style>
    /* Alinhamento de checkbox/radio e anel de foco (docs/06-eventos-e-
     * interatividade.md, "Destaque de foco"). Marcar um checkbox não muda
     * sua altura na linha: a marca não define a linha de base. Um campo de
     * texto vazio alinha como se tivesse uma linha de texto. O anel de
     * foco é um outline, que acompanha o border-radius; aqui ele é aplicado
     * por classe para aparecer sem foco. */
    body {
      margin: 24px;
      background: #f4f7fb;
      color: #263548;
      font-size: 16px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    section {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 14px 18px;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 17px;
      margin: 0 0 10px;
    }

    p {
      margin: 6px 0;
    }

    .anel {
      outline: 2px solid #808080;
      outline-offset: -1px;
    }

    .arredondado {
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>Checkbox, radio e anel de foco</h1>

  <section>
    <h2>Marcado e desmarcado na mesma linha</h2>
    <p>Texto <input type="checkbox"> antes <input type="checkbox" checked> depois <input type="checkbox"> fim</p>
    <p>Texto <input type="radio" name="a"> antes <input type="radio" name="b" checked> depois <input type="radio"
        name="c"> fim</p>
  </section>

  <section>
    <h2>Campos vazios e preenchidos na mesma linha</h2>
    <p>Texto <input type="search" style="width: 90px"> <input type="search" value="busca" style="width: 90px">
      <input type="number" value="7" style="width: 90px"> <input style="width: 90px"> fim
    </p>
  </section>

  <section>
    <h2>Anel de foco (outline)</h2>
    <p><input type="radio" class="anel" checked> radio <input type="checkbox" class="anel" checked> checkbox
      <button class="anel">Botão</button>
    </p>
    <p><input type="range" class="anel" value="40"> slider</p>
    <p><input class="anel" value="campo de texto"></p>
    <p><input class="anel arredondado" value="borda arredondada"></p>
  </section>
</body>

</html>
