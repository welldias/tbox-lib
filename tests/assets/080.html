<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font: 22px sans-serif;
            background: #eef2f7;
            color: #1e293b;
            padding: 24px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
            font-weight: 700;
        }

        p {
            margin: 2px 0;
        }

        .w100 {
            font-weight: 100;
        }

        .w200 {
            font-weight: 200;
        }

        .w300 {
            font-weight: 300;
        }

        .w400 {
            font-weight: 400;
        }

        .w500 {
            font-weight: 500;
        }

        .w600 {
            font-weight: 600;
        }

        .w700 {
            font-weight: 700;
        }

        .w800 {
            font-weight: 800;
        }

        .w900 {
            font-weight: 900;
        }

        .rel {
            font-weight: 300;
        }

        .rel b {
            font-weight: bolder;
        }

        .rel b i {
            font-weight: lighter;
            font-style: normal;
        }

        .cond {
            font-stretch: condensed;
        }

        .exp {
            font-stretch: 125%;
        }

        .short {
            font: italic 600 condensed 20px sans-serif;
        }
    </style>
</head>

<body>
    <h1>font-weight numerico e font-stretch</h1>
    <p class="w100">100 Thin</p>
    <p class="w200">200 Extra Light</p>
    <p class="w300">300 Light</p>
    <p class="w400">400 Regular</p>
    <p class="w500">500 Medium</p>
    <p class="w600">600 Semi Bold</p>
    <p class="w700">700 Bold</p>
    <p class="w800">800 Extra Bold</p>
    <p class="w900">900 Black</p>
    <p class="rel">300 <b>bolder = 400 <i>lighter = 100</i></b></p>
    <p class="cond">font-stretch: condensed</p>
    <p class="exp">font-stretch: 125%</p>
    <p class="short">font: italic 600 condensed 20px</p>
</body>

</html>
