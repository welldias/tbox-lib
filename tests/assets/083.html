<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font: 16px sans-serif;
      background: #eef2f7;
      color: #1e293b;
      padding: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .row {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
    }

    .slot {
      width: 150px;
      height: 70px;
      border: 2px dashed #94a3b8;
    }

    .b {
      width: 150px;
      height: 70px;
      background: #3b82f6;
      color: white;
      padding: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .t1 {
      transform: translate(20px, 10px);
    }

    .t2 {
      transform: translateX(50%);
      background: #10b981;
    }

    .t3 {
      transform: translateY(-20px) translateX(10px);
      background: #f59e0b;
    }

    .t4 {
      translate: -15px 15px;
      background: #ef4444;
    }

    .t5 {
      position: relative;
      left: 10px;
      transform: translate(10px);
      background: #8b5cf6;
    }

    .center {
      position: relative;
      width: 300px;
      height: 80px;
      background: white;
      border: 1px solid #94a3b8;
    }

    .center span {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #0f172a;
      color: white;
      padding: 6px 10px;
    }
  </style>
</head>

<body>
  <h1>transform: translate()</h1>
  <div class="row">
    <div class="slot">
      <div class="b t1">translate(20px, 10px)</div>
    </div>
    <div class="slot">
      <div class="b t2">translateX(50%)</div>
    </div>
    <div class="slot">
      <div class="b t3">Y(-20px) X(10px)</div>
    </div>
  </div>
  <div class="row">
    <div class="slot">
      <div class="b t4">translate: -15px 15px</div>
    </div>
    <div class="slot">
      <div class="b t5">relative + translate</div>
    </div>
  </div>
  <div class="center"><span>centrado com -50% -50%</span></div>
</body>

</html>
