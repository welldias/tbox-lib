<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <style>
    body {
      margin: 24px;
      background: #f4f7fb;
      color: #263548;
      font-size: 18px;
    }

    details {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 12px;
      margin: 12px 0;
    }

    summary {
      font-weight: bold;
    }

    p {
      margin: 10px 0 0;
    }
  </style>
</head>

<body>
  <h1>Detalhes expansíveis</h1>
  <p>Clique no título ou use Tab e Enter/Espaço para abrir.</p>
  <details>
    <summary>Pergunta fechada</summary>
    <p>Esta resposta aparece quando o item é aberto.</p>
  </details>
  <details open>
    <summary>Pergunta aberta inicialmente</summary>
    <p>Esta resposta começa visível.</p>
  </details>
</body>

</html>
