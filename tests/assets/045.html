<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #eef2f7; color: #1e293b; font: 16px sans-serif; padding: 24px; }
        h1 { margin: 0 0 8px; font-size: 25px; }
        p { margin: 0 0 16px; }
        .row { display: flex; gap: 16px; }
        .card { padding: 12px; background: white; border: 1px solid #cbd5e1; }
        .label { margin: 0 0 8px; font-weight: bold; }
        img { display: block; width: 144px; height: 144px; border: 2px solid #334155; }
        .pixelated { image-rendering: pixelated; }
        .auto { image-rendering: auto; }
    </style>
</head>
<body>
    <h1>image-rendering: pixelated</h1>
    <p>The same 8 by 8 pixel image enlarged to 144 by 144.</p>
    <div class="row">
        <div class="card">
            <p class="label">auto: smoothed edges</p>
            <img src="pixel-heart.png" alt="Pixelated heart with smooth interpolation">
        </div>
        <div class="card pixelated">
            <p class="label">pixelated: crisp pixels</p>
            <img src="pixel-heart.png" alt="Heart with enlarged pixels">
        </div>
        <div class="card pixelated">
            <p class="label">auto: overrides inheritance</p>
            <img class="auto" src="pixel-heart.png" alt="Heart with smooth interpolation">
        </div>
    </div>
</body>
</html>
