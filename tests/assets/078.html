<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font: 16px sans-serif;
      background: #eef2f7;
      color: #1e293b;
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    .row {
      display: flex;
      gap: 28px;
      margin-bottom: 26px;
    }

    .card {
      width: 160px;
      height: 80px;
      background: white;
      padding: 10px;
      border-radius: 8px;
    }

    .multi {
      box-shadow: 4px 4px 0 #f43f5e, 8px 8px 0 #f59e0b, 12px 12px 0 #10b981;
    }

    .inset {
      box-shadow: inset 0 0 0 4px #2563eb, inset 6px 6px 10px rgba(0, 0, 0, 0.35);
    }

    .both {
      box-shadow: 0 6px 12px rgba(15, 23, 42, 0.35), inset 0 -8px 0 #a5b4fc;
    }

    .ring {
      box-shadow: 0 0 0 3px #f472b6, 0 0 0 6px #fbcfe8;
      border-radius: 40px;
    }

    .inset2 {
      box-shadow: inset 10px 10px 0 -4px #fde68a;
      background: #fffbeb;
    }

    .pill {
      border-radius: 40px / 20px;
      box-shadow: inset 0 0 12px #0ea5e9, 3px 3px 0 #0c4a6e;
    }

    .t1 {
      font-size: 34px;
      font-weight: bold;
      color: #fff;
      text-shadow: 2px 2px 0 #1d4ed8, 4px 4px 0 #f97316;
    }

    .t2 {
      font-size: 34px;
      font-weight: bold;
      color: #0f172a;
      text-shadow: -2px -2px 0 #fcd34d, 2px 2px 0 #f472b6, 0 0 6px #22d3ee;
    }
  </style>
</head>

<body>
  <h1>Sombras multiplas e inset</h1>
  <div class="row">
    <div class="card multi">tres sombras</div>
    <div class="card inset">duas inset</div>
    <div class="card both">externa + inset</div>
  </div>
  <div class="row">
    <div class="card ring">aneis com spread</div>
    <div class="card inset2">inset com spread</div>
    <div class="card pill">eliptico</div>
  </div>
  <div class="t1">text-shadow em camadas</div>
  <div class="t2">tres sombras de texto</div>
</body>

</html>
