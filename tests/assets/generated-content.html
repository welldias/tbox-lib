<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font: 16px sans-serif;
      background: #eef2f7;
      color: #1e293b;
      padding: 24px;
    }

    h2 {
      font-size: 16px;
      margin: 18px 0 8px;
    }

    .card {
      width: 460px;
      padding: 8px 12px;
      margin: 8px 0;
      background: white;
    }

    /* Required field */
    label.required::after {
      content: " *";
      color: #dc2626;
    }

    /* Badge and status */
    .badge::after {
      content: attr(data-count);
      display: inline-block;
      margin-left: 6px;
      padding: 0 7px;
      background: #dc2626;
      color: white;
      font-size: 12px;
    }

    .status::before {
      content: "\25CF  ";
      color: #16a34a;
    }

    .status.off::before {
      color: #94a3b8;
    }

    /* Breadcrumb: separator between items */
    .crumbs span+span::before {
      content: " \203A  ";
      color: #94a3b8;
    }

    /* Quotations with nested quotes */
    q {
      quotes: "\201C" "\201D" "\2018" "\2019";
    }

    q::before {
      content: open-quote;
    }

    q::after {
      content: close-quote;
    }

    /* Empty decorative block */
    .alert::before {
      content: "";
      display: block;
      height: 4px;
      margin: -8px -12px 8px;
      background: #f59e0b;
    }
  </style>
</head>

<body>
  <h1>::before, ::after, attr() and quotes</h1>

  <h2>Form and status</h2>
  <div class="card">
    <label class="required">Name</label><br>
    <span class="badge" data-count="3">Messages</span><br>
    <span class="status">Online</span> &nbsp; <span class="status off">Offline</span>
  </div>

  <h2>Breadcrumb</h2>
  <div class="card crumbs"><span>Home</span><span>Settings</span><span>Account</span></div>

  <h2>quotes</h2>
  <p class="card">She said <q>read <q>the manual</q> first</q>.</p>

  <h2>Empty generated block</h2>
  <div class="card alert">Notice with a decorative strip generated by ::before.</div>
</body>

</html>
