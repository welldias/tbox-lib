<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font: 16px sans-serif;
      background: #eef2f7;
      color: #1e293b;
      padding: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 24px;
    }

    .stage {
      position: relative;
      z-index: 0;
      height: 200px;
      width: 700px;
      background: white;
      border: 1px solid #94a3b8;
      margin-bottom: 16px;
    }

    .card {
      position: absolute;
      width: 150px;
      height: 100px;
      padding: 8px;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
    }

    .a {
      left: 20px;
      top: 20px;
      background: #ef4444;
      z-index: 3;
    }

    .b {
      left: 80px;
      top: 50px;
      background: #3b82f6;
      z-index: 1;
    }

    .c {
      left: 140px;
      top: 80px;
      background: #10b981;
      z-index: 2;
    }

    .neg {
      left: 380px;
      top: 30px;
      background: #f59e0b;
      z-index: -1;
    }

    .flow {
      position: absolute;
      left: 420px;
      top: 60px;
      width: 200px;
      height: 90px;
      background: rgba(139, 92, 246, 0.85);
      color: white;
      padding: 8px;
      box-sizing: border-box;
    }

    .ctx {
      position: absolute;
      left: 20px;
      top: 20px;
      width: 300px;
      height: 150px;
      background: #e2e8f0;
      z-index: 1;
    }

    .inner {
      position: absolute;
      left: 160px;
      top: 20px;
      width: 160px;
      height: 80px;
      background: #0ea5e9;
      color: white;
      z-index: 100;
      padding: 6px;
      box-sizing: border-box;
    }

    .over {
      position: absolute;
      left: 260px;
      top: 60px;
      width: 200px;
      height: 90px;
      background: #f43f5e;
      color: white;
      z-index: 2;
      padding: 6px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <h1>z-index</h1>
  <div class="stage">
    <div class="card a">z-index 3 (primeiro no HTML)</div>
    <div class="card b">z-index 1</div>
    <div class="card c">z-index 2</div>
    <div class="card neg">z-index -1: sob o conteudo, sobre o fundo do palco</div>
    <div class="flow">absoluto sem z-index</div>
  </div>
  <div class="stage">
    <div class="ctx">contexto z-index 1
      <div class="inner">z-index 100 preso no contexto</div>
    </div>
    <div class="over">z-index 2 fica por cima</div>
  </div>
</body>

</html>
