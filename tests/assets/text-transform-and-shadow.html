<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font: 16px sans-serif;
      background: #f4f6f8;
      color: #283241;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    h2 {
      font-size: 16px;
      margin: 14px 0 6px;
    }

    p {
      margin: 0 0 4px;
    }

    .upper { text-transform: uppercase; }
    .lower { text-transform: lowercase; }
    .capitalize { text-transform: capitalize; }
    .shadow-hard { font-size: 22px; font-weight: bold; color: #1c7ed6; text-shadow: 2px 2px #f59f00; }
    .shadow-soft { font-size: 22px; font-weight: bold; color: #ffffff; text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.8); }
    .t1 { font-size: 34px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #1d4ed8, 4px 4px 0 #f97316; }
    .t2 { font-size: 34px; font-weight: bold; color: #0f172a; text-shadow: -2px -2px 0 #fcd34d, 2px 2px 0 #f472b6, 0 0 6px #22d3ee; }
  </style>
</head>

<body>
  <h1>text-transform and text-shadow</h1>
  <h2>text-transform</h2>
  <p class="upper">uppercase: são paulo and brasília</p>
  <p class="lower">LOWERCASE: SÃO PAULO AND BRASÍLIA</p>
  <p class="capitalize">capitalize: são paulo and brasília</p>
  <h2>text-shadow</h2>
  <p class="shadow-hard">Hard shadow 2px 2px</p>
  <p class="shadow-soft">Soft shadow with blur</p>
  <p class="t1">layered text-shadow</p>
  <p class="t2">three text shadows</p>
</body>

</html>
