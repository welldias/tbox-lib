<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font: 16px sans-serif;
      background: #eef2f7;
      color: #1e293b;
      padding: 24px;
    }

    h2 {
      font-size: 16px;
      margin: 18px 0 8px;
    }

    .card {
      width: 460px;
      padding: 16px;
      margin: 8px 0;
      background: white;
    }

    /* Box with a background: the shadow follows the rounded border */
    .tile {
      display: inline-block;
      width: 120px;
      padding: 14px;
      margin-right: 16px;
      background: #2563eb;
      color: white;
      border-radius: 12px;
      filter: drop-shadow(4px 6px 6px rgba(15, 23, 42, 0.45));
    }

    /* With a color function in the same list */
    .tile.gray {
      background: #16a34a;
      filter: grayscale(1) drop-shadow(0 4px 4px rgba(0, 0, 0, 0.5));
    }

    /* No background: the shadow goes on the text (and the descendants) */
    .title {
      font-size: 28px;
      font-weight: bold;
      color: #f59e0b;
      filter: drop-shadow(2px 2px 0 #92400e);
    }

    /* Two chained shadows */
    .double {
      display: inline-block;
      padding: 10px 14px;
      background: white;
      border: 2px solid #1e293b;
      filter: drop-shadow(4px 4px 0 #f472b6) drop-shadow(8px 8px 0 #38bdf8);
    }
  </style>
</head>

<body>
  <h1>filter: drop-shadow()</h1>

  <h2>Boxes with a background</h2>
  <div class="card">
    <span class="tile">Blue</span><span class="tile gray">grayscale + shadow</span>
  </div>

  <h2>Text without a background</h2>
  <div class="card">
    <div class="title">Heading with <em>shadow</em></div>
  </div>

  <h2>Two shadows</h2>
  <div class="card">
    <span class="double">Chained</span>
  </div>
</body>

</html>
