<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <style>
    /* Control parts through pseudo-elements (docs/10-formularios-e-
     * controles.md, "Partes dos controles"). Firefox and Chrome do not
     * implement most of these names (see "Equivalentes em outros
     * navegadores" in the same chapter). Each section uses one resolution
     * feature: color inheritance, var(), ancestor selector, control state
     * and per-corner radius. */
    :root {
      --accent: #c81e78;
      --track: #f1d5e4;
    }

    body {
      margin: 24px;
      background: #f4f7fb;
      color: #263548;
      font-size: 16px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    section {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 14px 18px;
      margin-bottom: 12px;
    }

    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      align-items: start;
    }

    h2 {
      font-size: 17px;
      margin: 0 0 10px;
    }

    p {
      margin: 6px 0;
    }

    /* Slider: track, fill and thumb. */
    input[type=range]::slider-track {
      height: 6px;
      background-color: var(--track);
      border-radius: 3px;
    }

    input[type=range]::slider-fill {
      background-color: var(--accent);
      border-radius: 3px;
    }

    input[type=range]::slider-thumb {
      width: 18px;
      height: 18px;
      background-color: white;
      border: 3px solid var(--accent);
      border-radius: 50%;
    }

    /* The control's state, not the part's. */
    input[type=range][disabled]::slider-thumb {
      border-color: #9aa3ae;
    }

    /* progress and meter: track and bar; radius only on the right corners. */
    progress::slider-track,
    meter::slider-track {
      background-color: #e2e8f0;
      border: 1px solid #94a3b8;
    }

    progress::slider-fill {
      background-color: #0e9488;
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
    }

    /* The select arrow inherits the control's color. */
    select {
      color: #7c3aed;
    }

    select::picker-icon {
      width: 12px;
      height: 8px;
    }

    /* Checkbox and radio: the mark. */
    input[type=checkbox]::checkmark,
    input[type=radio]::checkmark {
      color: #e67e22;
    }

    /* The file input button. */
    input[type=file]::file-selector-button {
      background-color: #263548;
      color: white;
      border: 0;
      border-radius: 4px;
    }

    /* The number buttons and the search clear button. */
    input[type=number]::step-control {
      background-color: #eef2ff;
      border-left: 1px solid #a5b4fc;
    }

    input[type=number]::step-up,
    input[type=number]::step-down {
      color: #4338ca;
    }

    input[type=search]::clear-icon {
      color: #be123c;
    }

    /* The color input swatch. */
    input[type=color]::color-swatch {
      border: 1px solid #263548;
      border-radius: 4px;
    }

    /* Text selection (shows when selecting with the mouse or Shift+arrows). */
    input::selection,
    textarea::selection {
      background-color: #fde68a;
      color: #78350f;
    }

    /* Dark theme on a container: the parts follow the ancestor. */
    .dark {
      background: #1e293b;
      color: #e2e8f0;
      --accent: #38bdf8;
      --track: #334155;
    }
  </style>
</head>

<body>
  <h1>Control parts</h1>
  <div class="cols">
  <div>
  <section>
    <h2>Slider</h2>
    <p><input type="range" value="60"> <input type="range" value="30" disabled></p>
  </section>

  <section class="dark">
    <h2>Slider in a dark container</h2>
    <p><input type="range" value="60"></p>
  </section>

  <section>
    <h2>progress and meter</h2>
    <p><progress value="60" max="100"></progress></p>
    <p><meter min="0" max="100" low="40" high="70" optimum="55" value="55"></meter></p>
  </section>

  </div>
  <section>
    <h2>Other controls</h2>
    <p><select>
        <option>First option</option>
        <option>Second option</option>
      </select></p>
    <p><input type="checkbox" checked> Checkbox <input type="radio" checked> Radio</p>
    <p><input type="file"></p>
    <p><input type="number" value="7"> <input type="search" value="search"></p>
    <p><input type="color" value="#c81e78"></p>
    <p><input value="Select this text"></p>
    <p><textarea rows="2">Or this one, in a text area.</textarea></p>
  </section>
  </div>
</body>

</html>
