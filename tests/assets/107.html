<!DOCTYPE html>
<html lang="pt-BR">
<head>
<style>
body { margin: 24px; background: #f4f7fb; color: #263548; font-size: 18px; }
select { width: 260px; }
</style>
</head>
<body>
<h1>Grupos de opções</h1>
<p>Abra o seletor para ver os títulos dos grupos. Use as setas para escolher.</p>
<select>
  <option value="none">Escolha uma opção</option>
  <optgroup label="Frutas">
    <option value="apple">Maçã</option>
    <option value="banana">Banana</option>
  </optgroup>
  <optgroup label="Indisponíveis" disabled>
    <option value="pear">Pera</option>
  </optgroup>
  <optgroup label="Bebidas">
    <option value="water">Água</option>
    <option value="juice">Suco</option>
  </optgroup>
</select>
</body>
</html>
