</style></head><body><h1>SVG symbols: file explorer icons</h1><p>Each symbol inherits currentColor independently; definitions occupy no layout space.</p>  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
