<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Motion Path</title>
  <style>
    html {
      background: white;
    }

    body {
      margin: 0;
      width: 760px;
      height: 540px;
      background: white;
      font-family: sans-serif;
      font-size: 14px;
    }

    .title {
      position: absolute;
      left: 24px;
      top: 16px;
    }

    .panel {
      position: absolute;
      background: #eef1f5;
    }

    .label {
      position: absolute;
      left: 10px;
      top: 10px;
    }

    .box {
      position: absolute;
      left: 0;
      top: 0;
      width: 40px;
      height: 20px;
    }

    .curve {
      left: 24px;
      top: 54px;
      width: 712px;
      height: 132px;
    }

    .curve .box {
      offset-path: path("M 20 80 C 120 0, 220 160, 320 80");
      offset-rotate: auto;
    }

    .start {
      background: #d63230;
      offset-distance: 0%;
    }

    .middle {
      background: #147d57;
      offset-distance: 50%;
    }

    .end {
      background: #215dcc;
      offset-distance: 100%;
    }

    .mark {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #263449;
    }

    .curve .m0 {
      left: 18px;
      top: 78px;
    }

    .curve .m1 {
      left: 168px;
      top: 78px;
    }

    .curve .m2 {
      left: 318px;
      top: 78px;
    }

    .circle {
      left: 24px;
      top: 214px;
      width: 220px;
      height: 190px;
    }

    .circle .box {
      background: #7a3bbb;
      offset-path: circle(60px at center);
      offset-distance: 25%;
      offset-rotate: 0deg;
    }

    .circle .mark {
      left: 108px;
      top: 153px;
    }

    .ray {
      left: 264px;
      top: 214px;
      width: 220px;
      height: 190px;
    }

    .ray .box {
      background: #d67512;
      offset-path: ray(45deg closest-side);
      offset-distance: 50%;
    }

    .anchors {
      left: 504px;
      top: 214px;
      width: 232px;
      height: 190px;
    }

    .mini {
      position: absolute;
      top: 32px;
      width: 110px;
      height: 150px;
    }

    .a {
      left: 4px;
    }

    .b {
      left: 118px;
    }

    .mini .label {
      left: 8px;
      top: 4px;
    }

    .mini .box {
      background: #128296;
      offset-path: path("M 40 80 H 80");
      offset-distance: 0%;
      offset-rotate: 0deg;
    }

    .b .box {
      background: #ca397b;
      offset-anchor: top left;
    }

    .mini .mark {
      left: 38px;
      top: 78px;
    }

    .note {
      position: absolute;
      left: 24px;
      top: 432px;
    }
  </style>
</head>

<body>
  <div class="title">Motion Path</div>
  <div class="panel curve">
    <div class="label">1 · path() — 0% / 50% / 100% · auto</div>
    <div class="box start"></div>
    <div class="box middle"></div>
    <div class="box end"></div>
    <div class="mark m0"></div>
    <div class="mark m1"></div>
    <div class="mark m2"></div>
  </div>
  <div class="panel circle">
    <div class="label">2 · circle() · 25% · 0deg</div>
    <div class="box"></div>
    <div class="mark"></div>
  </div>
  <div class="panel ray">
    <div class="label">3 · ray(45deg) · 50%</div>
    <div class="box"></div>
  </div>
  <div class="panel anchors">
    <div class="label">4 · offset-anchor</div>
    <div class="mini a">
      <div class="label">auto</div>
      <div class="box"></div>
      <div class="mark"></div>
    </div>
    <div class="mini b">
      <div class="label">top left</div>
      <div class="box"></div>
      <div class="mark"></div>
    </div>
  </div>
  <div class="note">Dark dots: position on the path.</div>
</body>

</html>
