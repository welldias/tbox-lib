<!DOCTYPE html>
<html><head><style>
body { font: 15px sans-serif; background: #eef2f7; color: #1e293b; padding: 24px; }
h1 { margin: 0 0 12px; font-size: 24px; }
.scroller { width: 360px; height: 240px; overflow-y: auto; background: white; border: 2px solid #94a3b8; }
.section h2 { position: sticky; top: 0; margin: 0; padding: 6px 10px; background: #1e40af; color: white; font-size: 15px; }
.section p { margin: 0; padding: 6px 10px; border-bottom: 1px solid #e2e8f0; }
.footer { position: sticky; bottom: 0; background: #fef3c7; padding: 6px 10px; margin: 0; }
</style></head><body>
<h1>position: sticky</h1>
<p>Role a caixa no tbox_app_demo: os titulos grudam no topo e o rodape no fundo.</p>
<div class="scroller">
  <div class="section"><h2>Secao A</h2><p>A1</p><p>A2</p><p>A3</p><p>A4</p><p>A5</p></div>
  <div class="section"><h2>Secao B</h2><p>B1</p><p>B2</p><p>B3</p><p>B4</p><p>B5</p></div>
  <div class="section"><h2>Secao C</h2><p>C1</p><p>C2</p><p>C3</p></div>
  <p class="footer">rodape sticky bottom</p>
</div>
</body></html>
