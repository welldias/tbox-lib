<!DOCTYPE html>
<html>

<head>
    <style>
        html {
            font-size: 20px;
        }

        body {
            font: 16px sans-serif;
            background: #eef2f7;
            color: #1e293b;
            padding: 24px;
            margin: 0;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 1.2rem;
        }

        .bar {
            height: 22px;
            margin: 0 0 8px;
            background: #3b82f6;
            color: white;
            font-size: 13px;
            padding-left: 6px;
            box-sizing: border-box;
        }

        .rem {
            width: 15rem;
        }

        .pt {
            width: 216pt;
            background: #10b981;
        }

        .cm {
            width: 6cm;
            background: #f59e0b;
        }

        .mm {
            width: 50mm;
            background: #ef4444;
        }

        .inch {
            width: 3in;
            background: #8b5cf6;
        }

        .pc {
            width: 18pc;
            background: #0ea5e9;
        }

        .ch {
            width: 40ch;
            background: #64748b;
        }

        .vw {
            width: 50vw;
            background: #ec4899;
        }

        .vh {
            height: 10vh;
            width: 120px;
            background: #14b8a6;
        }

        .vmin {
            width: 30vmin;
            background: #a3a3a3;
        }

        .small {
            font-size: 0.75rem;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h1>Unidades: rem, pt, pc, in, cm, mm, ch, vw, vh, vmin</h1>
    <div class="bar rem">15rem = 300px (raiz 20px)</div>
    <div class="bar pt">216pt = 288px</div>
    <div class="bar pc">18pc = 288px</div>
    <div class="bar inch">3in = 288px</div>
    <div class="bar cm">6cm</div>
    <div class="bar mm">50mm</div>
    <div class="bar ch">40ch</div>
    <div class="bar vw">50vw</div>
    <div class="bar vh">10vh</div>
    <div class="bar vmin">30vmin</div>
    <p class="small">Texto em 0.75rem = 15px</p>
</body>

</html>
