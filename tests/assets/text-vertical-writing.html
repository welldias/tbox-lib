<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <style>
    /* Vertical writing (docs/08-layout-e-pintura.md, "Escrita vertical";
     * docs/09-texto-e-fontes.md, "Escrita vertical"). Row 1: a vertical-rl
     * 200x220 block with two paragraphs (columns from right to left), the
     * same in vertical-lr (left to right) and text-orientation: upright on a
     * short Latin text. Row 2: a vertical-rl heading with
     * text-combine-upright: all on "2024", a sideways-lr label (read bottom
     * to top) and a horizontal div with a vertical-rl child (orthogonal
     * flow) next to a normal box: the margin-block-start (green, on the
     * right) and the padding-inline-start (top, inside the yellow
     * background) show the logical mapping. */
    body {
      margin: 20px;
      background: white;
      color: black;
      font-family: sans-serif;
      font-size: 16px;
    }

    .row {
      display: flex;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .cell {
      margin-right: 24px;
    }

    .label {
      font-size: 12px;
      height: 20px;
      color: #333;
    }

    .block {
      width: 200px;
      height: 220px;
      border: 2px solid #1f4e9c;
      background: #e8f0ff;
      box-sizing: border-box;
    }

    .block p {
      margin: 0 0 0 0;
      margin-block-end: 12px;
      padding: 4px;
    }

    .block p:first-child {
      background: #ffd27a;
    }

    .block p + p {
      background: #b9e6b0;
    }

    .rl {
      writing-mode: vertical-rl;
    }

    .lr {
      writing-mode: vertical-lr;
    }

    .upright {
      writing-mode: vertical-rl;
      text-orientation: upright;
      width: 60px;
      height: 220px;
      border: 2px solid #8a2be2;
      background: #f3e6ff;
      box-sizing: border-box;
    }

    .title {
      writing-mode: vertical-rl;
      width: 80px;
      height: 180px;
      border: 2px solid #b22222;
      background: #ffe4e1;
      box-sizing: border-box;
      font-size: 20px;
    }

    .combined {
      text-combine-upright: all;
      color: #b22222;
    }

    .lateral {
      writing-mode: sideways-lr;
      width: 40px;
      height: 180px;
      background: #2e8b57;
      color: white;
      box-sizing: border-box;
    }

    .horizontal {
      display: flex;
      align-items: flex-start;
      width: 260px;
      height: 180px;
      background: #dddddd;
    }

    .orthogonal {
      writing-mode: vertical-rl;
      width: 60px;
      height: 150px;
      margin-block-start: 20px;
      padding-inline-start: 30px;
      background: #ffff66;
      border: 2px solid #333;
    }

    .normal {
      width: 100px;
      height: 80px;
      background: #4a90d9;
      color: white;
    }
  </style>
</head>

<body>
  <div class="row">
    <div class="cell">
      <div class="label">vertical-rl</div>
      <div class="block rl">
        <p>First text in a column.</p>
        <p>Second par.</p>
      </div>
    </div>
    <div class="cell">
      <div class="label">vertical-lr</div>
      <div class="block lr">
        <p>First text in a column.</p>
        <p>Second par.</p>
      </div>
    </div>
    <div class="cell">
      <div class="label">upright</div>
      <div class="upright">ABC 123</div>
    </div>
  </div>
  <div class="row">
    <div class="cell">
      <div class="label">combine</div>
      <div class="title">Year <span class="combined">2024</span> end</div>
    </div>
    <div class="cell">
      <div class="label">sideways-lr</div>
      <div class="lateral">Side label</div>
    </div>
    <div class="cell">
      <div class="label">orthogonal flow</div>
      <div class="horizontal">
        <div class="orthogonal">Vertical</div>
        <div class="normal">Normal</div>
      </div>
    </div>
  </div>
</body>

</html>
