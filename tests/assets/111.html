<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <style>
    body {
      margin: 24px;
    }

    img {
      width: 160px;
      height: 160px;
    }
  </style>
</head>

<body>
  <h1>Image chosen by source</h1>
  <picture>
    <source type="image/png" srcset="yellow.png">
    <img src="black.png" alt="Colored square">
  </picture>
  <p>The yellow image comes from source; black.png is the img fallback.</p>
</body>

</html>
