<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #eef2f7; color: #1e293b; font: 16px sans-serif; padding: 24px; }
        h1 { margin: 0 0 8px; font-size: 25px; }
        .card { width: 420px; padding: 14px; background: white; border: 1px solid #cbd5e1; }
        .item { padding: 8px; margin: 0 0 5px; background: #e2e8f0; }
        p:lang(pt) { background: #bbf7d0; }
        p:lang(en) { background: #bfdbfe; }
    </style>
</head>
<body>
    <h1>:lang() selector</h1>
    <div class="card" lang="pt-BR">
        <p class="item">Inherited from pt-BR: green</p>
        <div><p class="item">Inherited through two levels: green</p></div>
        <section lang="en-US"><p class="item">Language en-US: blue</p></section>
        <p class="item" lang="">Empty language: gray</p>
    </div>
</body>
</html>
