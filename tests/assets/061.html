<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font: 16px sans-serif;
            background: #eef2f7;
            color: #1e293b;
            padding: 24px;
        }

        .box {
            width: 300px;
            padding: 18px;
            margin: 16px 0;
            background: white;
        }

        .block {
            border-block: 5px solid #2563eb;
        }

        .inline {
            border-inline: 5px dashed #16a34a;
        }

        .both {
            border-block: 4px solid #2563eb;
            border-inline: 4px solid #16a34a;
            border-top: 8px solid #ef4444;
        }
    </style>
</head>

<body>
    <h1>border-block and border-inline</h1>
    <div class="box block">Top and bottom borders</div>
    <div class="box inline">Left and right borders</div>
    <div class="box both">Both axes; the individual top border wins</div>
</body>

</html>
