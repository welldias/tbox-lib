<!DOCTYPE html>
<html>

<head>
    <style>
        .sheet-heading {
            color: blue;
            font-family: verdana;
            font-size: 200%;
        }

        .sheet-paragraph {
            color: red;
            font-family: courier;
            font-size: 160%;
        }
    </style>
</head>

<body style="background-color:powderblue;">

    <p>I am normal <span style="color:red;">I am red</span> <span style="color:blue;">I am blue</span></p>
    <p style="font-size:40px;">I am big</p>

    <h2 style="background-color:lightyellow;">A heading with its own background</h2>
    <p style="background-color:tomato;">A paragraph with its own background.</p>

    <h2 style="font-family:verdana;">Heading in verdana</h2>
    <p style="font-family:courier;">Paragraph in courier.</p>

    <h2 style="text-align:center;">Centered Heading</h2>
    <p style="text-align:center;">Centered paragraph.</p>

    <h2 class="sheet-heading">Sheet: heading at 200%</h2>
    <p class="sheet-paragraph">Sheet: paragraph at 160%.</p>

</body>

</html>
