<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <style>
    /* Transformações 2D (docs/08-layout-e-pintura.md, "Transformações"):
     * rotate(), scale(), skewX(), matrix(), transform-origin, as
     * propriedades individuais rotate/scale, composição translate+rotate
     * e as funções 3D achatadas (rotateZ = rotate; rotateX sem perspectiva
     * só encolhe a altura). Cada caixa tem 100x60, borda e uma palavra;
     * a caixa transformada é desenhada inteira (fundo, borda, texto). */
    body {
      margin: 0;
      padding: 10px;
      background: white;
      font-family: sans-serif;
    }

    .grade {
      display: flex;
      flex-wrap: wrap;
      width: 780px;
    }

    .celula {
      width: 260px;
      height: 190px;
    }

    .rotulo {
      margin: 0;
      height: 20px;
      font-size: 13px;
      color: #333333;
    }

    .caixa {
      width: 94px;
      height: 54px;
      margin: 45px 0 0 80px;
      border: 3px solid #1a1a1a;
      font-size: 18px;
      line-height: 54px;
      text-align: center;
      color: white;
    }

    .a { background: #d62828; transform: rotate(30deg); }
    .b { background: #1d6fd6; transform: scale(1.3, 0.7); }
    .c { background: #2a9d3a; transform: skewX(20deg); }
    .d { background: #8a2be2; transform: matrix(0.8, 0.3, -0.3, 0.8, 10, 0); }
    .e { background: #e07b00; transform-origin: top left; transform: rotate(20deg); }
    .f { background: #008b8b; rotate: 25deg; scale: 0.8 1.2; }
    .g { background: #c2185b; transform: translate(20px, 10px) rotate(-30deg); }
    .h { background: #5d4037; transform: rotateZ(45deg); }
    .i { background: #37474f; transform: rotateX(60deg); }
  </style>
</head>

<body>
  <div class="grade">
    <div class="celula"><p class="rotulo">rotate(30deg)</p><div class="caixa a">Ab</div></div>
    <div class="celula"><p class="rotulo">scale(1.3, 0.7)</p><div class="caixa b">Ab</div></div>
    <div class="celula"><p class="rotulo">skewX(20deg)</p><div class="caixa c">Ab</div></div>
    <div class="celula"><p class="rotulo">matrix(...)</p><div class="caixa d">Ab</div></div>
    <div class="celula"><p class="rotulo">origin top left</p><div class="caixa e">Ab</div></div>
    <div class="celula"><p class="rotulo">rotate + scale</p><div class="caixa f">Ab</div></div>
    <div class="celula"><p class="rotulo">translate rotate</p><div class="caixa g">Ab</div></div>
    <div class="celula"><p class="rotulo">rotateZ(45deg)</p><div class="caixa h">Ab</div></div>
    <div class="celula"><p class="rotulo">rotateX(60deg)</p><div class="caixa i">Ab</div></div>
  </div>
</body>

</html>
