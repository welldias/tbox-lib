<!DOCTYPE html>
<html>

<head>
    <style>
        p {
            border: 2px solid powderblue;
        }

        .padded {
            padding: 30px;
        }

        .spaced {
            margin: 50px;
        }
    </style>
</head>

<body>

    <h1>This is a heading</h1>

    <p>A paragraph with a border.</p>
    <p>Another paragraph with a border.</p>

    <p class="padded">A paragraph with 30px of padding.</p>
    <p class="padded">Another paragraph with 30px of padding.</p>

    <p class="spaced">A paragraph with a 50px margin.</p>
    <p class="spaced">Another paragraph with a 50px margin.</p>

</body>

</html>
