<!DOCTYPE html>
<html>

<body>
  <h1>Keyboard and text input</h1>
  <p>Use Tab and Shift+Tab to move focus. In the field, drag to select or double click to select all. Ctrl+C, Ctrl+X and Ctrl+V use the clipboard. Hold a key to repeat it. A long value scrolls to keep the cursor visible.</p>
  <input id="name" type="text" value="This long value stays inside its text field">
  <button id="first">First button</button>
  <button id="second">Second button</button>
  <p id="status">No button activated yet.</p>
</body>

</html>
