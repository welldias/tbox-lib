<!DOCTYPE html>
<html lang="pt-BR">
<head>
<style>
body { margin: 24px; background: #f4f7fb; color: #263548; font-size: 18px; }
fieldset { background: white; border: 2px solid #52709a; margin: 20px 0; }
legend { color: #274876; font-weight: bold; }
label { display: inline-block; width: 100px; }
input { width: 220px; }
p { margin: 10px 0; }
</style>
</head>
<body>
<h1>Group legend</h1>
<fieldset>
  <legend>Personal data</legend>
  <p><label>Name</label><input type="text" value="Ana"></p>
  <p><label>Age</label><input type="number" value="28"></p>
</fieldset>
<fieldset>
  <legend>Preferences</legend>
  <p><label>Color</label><input type="color" value="#52709a"></p>
</fieldset>
</body>
</html>
