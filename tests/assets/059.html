<!DOCTYPE html>
<html><head><style>
body { font: 16px sans-serif; background: #eef2f7; color: #1e293b; padding: 24px; }
.box { inline-size: 280px; block-size: 80px; padding: 14px; margin: 12px 0; background: #bfdbfe; }
.second { width: 320px; inline-size: 220px; background: #bbf7d0; }
</style></head><body>
<h1>inline-size e block-size</h1>
<p>Tamanhos logicos no modo horizontal, da esquerda para a direita.</p>
<div class="box">280px de largura por 80px de altura</div>
<div class="box second">inline-size posterior vence width: 220px</div>
</body></html>
