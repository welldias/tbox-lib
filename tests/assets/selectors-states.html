<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      background: #eef2f7;
      color: #1e293b;
      font: 16px sans-serif;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .row {
      display: flex;
      gap: 14px;
      margin-bottom: 14px;
      align-items: flex-start;
    }

    .card {
      padding: 10px;
      background: white;
      border: 1px solid #cbd5e1;
    }

    h2 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .item {
      display: block;
      padding: 5px 8px;
      margin: 0 0 4px;
      background: #e2e8f0;
    }

    .card { width: 330px; }
    .field { margin: 0 0 8px; }
    label { display: block; margin: 0 0 3px; }
    .forms input, .forms textarea { display: block; width: 260px; padding: 5px; border: 2px solid #94a3b8; }
    .forms input:required, .forms textarea:required { border-color: #dc2626; background: #fee2e2; }
    .forms input:optional, .forms textarea:optional { border-color: #16a34a; background: #dcfce7; }
    .focus:focus-within { border-color: #2563eb; background: #dbeafe; }
    .focus { border-width: 2px; }
    .focus input:focus, .focus button:focus { outline: none; }
    .focus input:focus-visible, .focus button:focus-visible { outline: 3px solid #7c3aed; }
    .enabled input { padding: 4px; margin-right: 6px; width: 120px; }
    .enabled input:enabled { border: 2px solid #2563eb; background: #eff6ff; }
    .enabled input:disabled { border: 2px solid #94a3b8; background: #e2e8f0; color: #64748b; }
    a.item:link { color: #1d4ed8; }
    a.item:any-link { border-left: 5px solid #2563eb; background: #dbeafe; }
    .hover:hover { background: #dbeafe; border-color: #2563eb; }
    .hover .inner { padding: 12px; background: #bbf7d0; }
    .hover .inner:hover { background: #86efac; }
  </style>
</head>

<body>
  <h1>State pseudo-classes</h1>
  <div class="row">
    <div class="card forms">
      <h2>:required and :optional</h2>
      <div class="field"><label>Required name: red</label><input required value="Ada"></div>
      <div class="field"><label>Optional nickname: green</label><input value="A"></div>
      <div class="field"><label>Required comment: red</label><textarea required>Write here</textarea></div>
      <div class="field"><label>Optional note: green</label><textarea>Not required</textarea></div>
    </div>
    <div>
      <div class="card focus">
        <h2>:focus-within (click the field)</h2>
        <input value="Ada">
        <button>Tab: purple ring; click: no ring</button>
      </div>
      <div class="card enabled" style="margin-top: 10px">
        <h2>:enabled and :disabled</h2>
        <input value="Enabled"><input value="Disabled" disabled>
      </div>
      <div class="card" style="margin-top: 10px">
        <h2>:link and :any-link</h2>
        <a class="item" href="https://example.org/one">With href: blue and border</a>
        <a class="item">Without href: gray</a>
      </div>
    </div>
  </div>
  <div class="card hover">
    <h2>:hover on ancestors (hover the green area)</h2>
    <div class="inner">Inner area</div>
  </div>
</body>

</html>
