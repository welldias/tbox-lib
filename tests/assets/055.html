<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #eef2f7;
            color: #1e293b;
            font: 16px sans-serif;
            padding: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .card {
            width: 310px;
            padding: 14px;
            background: white;
            border: 1px solid #cbd5e1;
        }

        ol {
            list-style-type: decimal-leading-zero;
        }

        li {
            margin: 0 0 7px;
        }
    </style>
</head>

<body>
    <h1>list-style-type: decimal-leading-zero</h1>
    <div class="card">
        <ol>
            <li>Primeiro item</li>
            <li>Segundo item</li>
            <li>Terceiro item</li>
            <li>Quarto item</li>
            <li>Quinto item</li>
            <li>Sexto item</li>
            <li>Setimo item</li>
            <li>Oitavo item</li>
            <li>Nono item</li>
            <li>Decimo item</li>
        </ol>
    </div>
</body>

</html>
