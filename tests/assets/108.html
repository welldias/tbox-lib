<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <style>
    body {
      margin: 24px;
      background: #f4f7fb;
      color: #263548;
      font-size: 18px;
    }

    details {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 12px;
      margin: 12px 0;
    }

    summary {
      font-weight: bold;
    }

    p {
      margin: 10px 0 0;
    }
  </style>
</head>

<body>
  <h1>Expandable details</h1>
  <p>Click the title or use Tab and Enter/Space to open.</p>
  <details>
    <summary>Closed question</summary>
    <p>This answer appears when the item is opened.</p>
  </details>
  <details open>
    <summary>Question open at first</summary>
    <p>This answer starts visible.</p>
  </details>
</body>

</html>
