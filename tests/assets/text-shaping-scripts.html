<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    /* Shaping (docs/09-texto-e-fontes.md, "Shaping"). With HarfBuzz
     * (TBOX_ENABLE_HARFBUZZ=ON) every "after" line differs from the "before"
     * one; without it, both come out the same. The examples use DejaVu Sans,
     * which has ligatures, GPOS kerning, Arabic and Hebrew. */
    body {
      font: 20px "DejaVu Sans";
      background: #eef2f7;
      color: #1e293b;
      padding: 16px 24px;
      line-height: 1.5;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 8px;
    }

    h2 {
      font-size: 15px;
      line-height: 1.2;
      margin: 14px 0 6px;
      color: #475569;
    }

    .card {
      width: 640px;
      padding: 6px 12px;
      background: white;
    }

    .row {
      white-space: nowrap;
    }

    .label {
      display: inline-block;
      width: 230px;
      white-space: normal;
      line-height: 1.2;
      vertical-align: middle;
      font-size: 13px;
      color: #64748b;
    }

    .big {
      font-size: 34px;
    }

    input,
    textarea {
      font: 20px "DejaVu Sans";
      width: 300px;
    }
  </style>
</head>

<body>
  <h1>Shaping with HarfBuzz: Arabic, Hebrew and editing</h1>
  <h2>Contextual forms: Arabic and Hebrew with vowel marks</h2>
  <div class="card">
    <div class="row"><span class="label">isolated letters (with ZWNJ)</span><span
        class="big">&#x633;&#x200C;&#x644;&#x200C;&#x627;&#x200C;&#x645;</span></div>
    <div class="row"><span class="label">word (joined forms)</span><span class="big">سلام</span></div>
    <div class="row"><span class="label">Hebrew with niqqud</span><span class="big">שָׁלוֹם</span></div>
    <div class="row"><span class="label">sentence (no bidi: logical order)</span><span class="big">مرحبا بالعالم</span>
    </div>
  </div>

  <h2>Editing: click between the "f" and the "i" of a ligature</h2>
  <div class="card">
    <input value="office affinity"><br>
    <input type="password" value="office"><br>
    <textarea rows="2">fluffy official
affinity</textarea>
  </div>
</body>

</html>
