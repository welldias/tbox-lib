<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #eef2f7; color: #1e293b; font: 16px sans-serif; padding: 24px; }
        h1 { margin: 0 0 8px; font-size: 25px; }
        h2 { margin: 22px 0 8px; font-size: 19px; }
        p { margin: 0 0 12px; }
        .row { display: flex; gap: 14px; }
        .card { padding: 10px; background: white; border: 1px solid #cbd5e1; }
        .label { margin: 0 0 6px; font-weight: bold; }
        img { display: block; border: 2px solid #334155; background: #dbeafe; }
        .small { width: 160px; height: 110px; }
        .large { width: 500px; height: 330px; }
        .none { object-fit: none; }
        .scale-down { object-fit: scale-down; }
        .contain { object-fit: contain; }
    </style>
</head>
<body>
    <h1>object-fit: none e scale-down</h1>
    <p>A imagem original mede 386 por 270 pixels.</p>

    <h2>Caixa menor que a imagem</h2>
    <div class="row">
        <div class="card"><p class="label">none: recorte central</p><img class="small none" src="bird.png" alt="Passaro"></div>
        <div class="card"><p class="label">scale-down: reduzida</p><img class="small scale-down" src="bird.png" alt="Passaro"></div>
        <div class="card"><p class="label">contain: reduzida</p><img class="small contain" src="bird.png" alt="Passaro"></div>
    </div>

    <h2>Caixa maior que a imagem</h2>
    <div class="card"><p class="label">scale-down: tamanho natural, sem ampliacao</p><img class="large scale-down" src="bird.png" alt="Passaro"></div>
</body>
</html>
