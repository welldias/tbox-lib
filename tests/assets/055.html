<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #eef2f7;
            color: #1e293b;
            font: 16px sans-serif;
            padding: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .card {
            width: 310px;
            padding: 14px;
            background: white;
            border: 1px solid #cbd5e1;
        }

        ol {
            list-style-type: decimal-leading-zero;
        }

        li {
            margin: 0 0 7px;
        }
    </style>
</head>

<body>
    <h1>list-style-type: decimal-leading-zero</h1>
    <div class="card">
        <ol>
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
            <li>Fourth item</li>
            <li>Fifth item</li>
            <li>Sixth item</li>
            <li>Seventh item</li>
            <li>Eighth item</li>
            <li>Ninth item</li>
            <li>Tenth item</li>
        </ol>
    </div>
</body>

</html>
