<!DOCTYPE html>
<html><head><style>
body { font: 15px sans-serif; background: #eef2f7; color: #1e293b; padding: 24px; }
h1 { margin: 0 0 16px; font-size: 24px; }
.row { display: flex; gap: 20px; margin-bottom: 20px; }
.b { width: 160px; height: 80px; background: white; padding: 10px; box-sizing: border-box; }
.d1 { border: 3px dashed #2563eb; border-radius: 16px; }
.d2 { border: 4px dotted #db2777; border-radius: 30px; }
.d3 { border: 2px dashed #16a34a; border-radius: 50%; }
.d4 { border: 6px dotted #f59e0b; border-radius: 40px / 20px; }
.pill { border: 3px dashed #475569; border-radius: 999px; padding: 8px 20px; display: inline-block; }
</style></head><body>
<h1>dashed e dotted em bordas arredondadas</h1>
<div class="row"><div class="b d1">dashed 16px</div><div class="b d2">dotted 30px</div><div class="b d3">dashed 50%</div><div class="b d4">dotted eliptico</div></div>
<span class="pill">pilula tracejada</span>
</body></html>
