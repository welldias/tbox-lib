<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #f7f7f7; }
        h2 { margin-bottom: 12px; }
        .card {
            width: 420px;
            margin-left: 24px;
            margin-top: 16px;
            padding: 12px;
            padding-left: 20px;
            background: #e6f3ff;
            border: 1px solid #7799bb;
            outline: 2px solid #336699;
        }
        .spaced { word-spacing: 8px; }
        .indented { text-indent: 30px; }
        .overline { text-decoration: overline; text-decoration-color: #336699; }
    </style>
</head>
<body>
    <h2>Additional CSS styles</h2>
    <div class="card">
        <p class="spaced">Word spacing changes the distance between these words.</p>
        <p class="indented">Text indent moves only the first line of this paragraph. The following words wrap at the available width.</p>
        <p class="overline">Overline decoration</p>
    </div>
</body>
</html>
