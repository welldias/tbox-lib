<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            background: #eef2f7;
            color: #1e293b;
            font: 16px sans-serif;
            padding: 24px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 25px;
        }

        .card {
            width: 440px;
            padding: 20px;
            background: white;
            border: 1px solid #cbd5e1;
        }

        p {
            margin: 0 0 25px;
            font-size: 26px;
        }

        .solid {
            text-decoration: underline solid #dc2626 2px;
        }

        .wavy {
            text-decoration: underline wavy #2563eb 2px;
        }

        .strike {
            text-decoration: line-through wavy #16a34a 2px;
        }
    </style>
</head>

<body>
    <h1>text-decoration-style: wavy</h1>
    <div class="card">
        <p class="solid">Linha solida</p>
        <p class="wavy">Linha ondulada</p>
        <p class="strike">Risco ondulado</p>
    </div>
</body>

</html>
