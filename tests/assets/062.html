<!DOCTYPE html>
<html><head><style>
body { font: 22px sans-serif; background: #eef2f7; color: #1e293b; padding: 24px; }
p { margin: 18px 0; }
.normal { text-decoration: underline; text-underline-position: auto; }
.under { text-decoration: underline; text-underline-position: under; }
.offset { text-decoration: underline; text-underline-position: under; text-underline-offset: 2px; }
</style></head><body>
<h1>text-underline-position: under</h1>
<p class="normal">Posicao automatica: gypq</p>
<p class="under">Abaixo dos descendentes: gypq</p>
<p class="offset">Deslocamento explicito prevalece: gypq</p>
</body></html>
