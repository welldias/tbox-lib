<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <style>
    @font-face {
      font-family: "Project Font";
      src: url("../../external/liberation-sans/LiberationSans-Regular.ttf");
      font-weight: 400;
      font-style: normal;
    }

    body {
      margin: 24px;
      background: #f1f5f9;
      color: #172033;
      font-family: "Project Font";
      font-size: 17px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 29px;
    }

    p {
      margin: 0 0 14px;
    }

    .status {
      padding: 10px 14px;
      background: #dbeafe;
      border: 1px solid #3b82f6;
      margin-bottom: 16px;
    }

    .status .wide {
      display: none;
    }

    .cards {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      width: 210px;
      height: 115px;
      padding: 18px;
      background-color: #38bdf8;
      color: #082f49;
      border: 2px solid #0284c7;
      transition: background-color 450ms ease, color 450ms ease, opacity 450ms linear;
    }

    .card:hover {
      background-color: #7c3aed;
      color: white;
      opacity: 0.72;
    }

    @media screen and (max-width: 600px) {
      .cards {
        flex-direction: column;
      }

      .card {
        width: 80%;
      }
    }

    @media screen and (min-width: 601px) {
      .status {
        background: #dcfce7;
        border-color: #16a34a;
      }

      .status .narrow {
        display: none;
      }

      .status .wide {
        display: inline;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <h1>@media, transition and @font-face</h1>
  <p>Resize the window to change the card layout. Hover them to see the transition.</p>
  <div class="status"><span class="narrow">Narrow window</span><span class="wide">Wide window</span></div>
  <div class="cards">
    <div class="card">Animated background and text color.</div>
    <div class="card">Opacity animated over the same interval.</div>
  </div>
  <p>All the text uses a local font declared with @font-face.</p>
</body>

</html>
