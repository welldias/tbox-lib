<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font: 16px sans-serif;
            background: #eef2f7;
            color: #1e293b;
            padding: 24px;
        }

        .box {
            inline-size: 280px;
            block-size: 80px;
            padding: 14px;
            margin: 12px 0;
            background: #bfdbfe;
        }

        .second {
            width: 320px;
            inline-size: 220px;
            background: #bbf7d0;
        }
    </style>
</head>

<body>
    <h1>inline-size and block-size</h1>
    <p>Logical sizes in horizontal mode, left to right.</p>
    <div class="box">280px wide by 80px tall</div>
    <div class="box second">later inline-size wins over width: 220px</div>
</body>

</html>
