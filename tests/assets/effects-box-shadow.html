<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      font: 16px sans-serif;
      background: #eef2f7;
      color: #1e293b;
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }

    .row {
      display: flex;
      gap: 28px;
      margin-bottom: 26px;
    }

    .card {
      width: 140px;
      height: 70px;
      background: white;
      padding: 10px;
      border-radius: 8px;
    }

    .multi { box-shadow: 4px 4px 0 #f43f5e, 8px 8px 0 #f59e0b, 12px 12px 0 #10b981; }
    .inset { box-shadow: inset 0 0 0 4px #2563eb, inset 6px 6px 10px rgba(0, 0, 0, 0.35); }
    .both { box-shadow: 0 6px 12px rgba(15, 23, 42, 0.35), inset 0 -8px 0 #a5b4fc; }
    .ring { box-shadow: 0 0 0 3px #f472b6, 0 0 0 6px #fbcfe8; border-radius: 40px; }
    .inset2 { box-shadow: inset 10px 10px 0 -4px #fde68a; background: #fffbeb; }
    .pill { border-radius: 40px / 20px; box-shadow: inset 0 0 12px #0ea5e9, 3px 3px 0 #0c4a6e; }
    .spread-out { box-shadow: 0 0 0 4px #74c0fc; border-radius: 6px; }
    .spread-blur { box-shadow: 0 4px 8px 2px rgba(0, 0, 0, 0.3); border-radius: 6px; }
    .spread-in { box-shadow: 0 10px 6px -4px #495057; border-radius: 6px; }
    .bordered { border: 6px solid navy; border-radius: 24px; box-shadow: 8px 8px 16px rgba(0, 0, 0, 0.5); }
    .drop { background: mediumseagreen; border-radius: 45px; box-shadow: 0px 6px 0px rgba(0, 0, 0, 0.6); }
  </style>
</head>

<body>
  <h1>box-shadow: lists, inset, spread and blur</h1>
  <div class="row">
    <div class="card multi">three shadows</div>
    <div class="card inset">two inset</div>
    <div class="card both">outer + inset</div>
    <div class="card bordered">border + blur</div>
  </div>
  <div class="row">
    <div class="card ring">rings with spread</div>
    <div class="card inset2">inset with spread</div>
    <div class="card pill">elliptical</div>
    <div class="card drop">pill, hard drop</div>
  </div>
  <div class="row">
    <div class="card spread-out">spread 4px</div>
    <div class="card spread-blur">blur 8px, spread 2px</div>
    <div class="card spread-in">negative spread</div>
  </div>
</body>

</html>
