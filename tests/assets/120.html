<!DOCTYPE html>
<html>

<head>
  <style>
    @namespace url(http://www.w3.org/1999/xhtml);

    body {
      font: 16px sans-serif;
      background: #eef2f7;
      color: #1e293b;
      padding: 24px;
    }

    h2 {
      font-size: 16px;
      margin: 18px 0 8px;
    }

    .card {
      width: 420px;
      padding: 8px 12px;
      margin: 8px 0;
      background: white;
    }

    /* font-size-adjust: the same "x" height (0.6 of the font-size) in fonts with different proportions. */
    .adjust p {
      margin: 4px 0;
      font-size: 18px;
    }

    .serif {
      font-family: serif;
    }

    .mono {
      font-family: monospace;
    }

    .adjust.on p {
      font-size-adjust: ex-height 0.6;
    }

    /* scroll-behavior: with Tab, the list scrolls smoothly to the focused button. */
    .list {
      height: 90px;
      overflow-y: auto;
      scroll-behavior: smooth;
      background: #dbeafe;
      padding: 0 8px;
    }

    .list button {
      display: block;
      width: 200px;
      margin: 6px 0;
    }

    /* @starting-style: the card fades in when it opens (and when it leaves display: none). The headless capture shows the final state. */
    .fade {
      opacity: 1;
      background: #dcfce7;
      transition: opacity 0.8s ease-out, background-color 0.8s ease-out;
    }

    @starting-style {
      .fade {
        opacity: 0;
        background: #bbf7d0;
      }
    }
  </style>
</head>

<body>
  <h1>font-size-adjust, scroll-behavior and @starting-style</h1>

  <h2>font-size-adjust (left: none; right: ex-height 0.6)</h2>
  <div style="display: flex; gap: 12px">
    <div class="card adjust" style="width: 200px">
      <p>sans xyz 123</p>
      <p class="serif">serif xyz 123</p>
      <p class="mono">mono xyz 123</p>
    </div>
    <div class="card adjust on" style="width: 200px">
      <p>sans xyz 123</p>
      <p class="serif">serif xyz 123</p>
      <p class="mono">mono xyz 123</p>
    </div>
  </div>

  <h2>scroll-behavior: smooth (use Tab)</h2>
  <div class="card list">
    <button>One</button><button>Two</button><button>Three</button>
    <button>Four</button><button>Five</button><button>Six</button>
  </div>

  <h2>@starting-style</h2>
  <div class="card fade">This card fades in when the page opens.</div>
</body>

</html>
