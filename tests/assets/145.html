<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <style>
    /* Checkbox/radio alignment and focus ring (docs/06-eventos-e-
     * interatividade.md, "Destaque de foco"). Checking a checkbox does not
     * change its height in the line: the mark does not set the baseline. An
     * empty text field aligns as if it had a line of text. The focus ring
     * is an outline that follows border-radius; here it is applied by class
     * so it shows without focus. */
    body {
      margin: 24px;
      background: #f4f7fb;
      color: #263548;
      font-size: 16px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 16px;
    }

    section {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 14px 18px;
      margin-bottom: 12px;
    }

    h2 {
      font-size: 17px;
      margin: 0 0 10px;
    }

    p {
      margin: 6px 0;
    }

    .anel {
      outline: 2px solid #808080;
      outline-offset: -1px;
    }

    .arredondado {
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>Checkbox, radio and focus ring</h1>

  <section>
    <h2>Checked and unchecked on the same line</h2>
    <p>Text <input type="checkbox"> before <input type="checkbox" checked> after <input type="checkbox"> end</p>
    <p>Text <input type="radio" name="a"> before <input type="radio" name="b" checked> after <input type="radio"
        name="c"> end</p>
  </section>

  <section>
    <h2>Empty and filled fields on the same line</h2>
    <p>Text <input type="search" style="width: 90px"> <input type="search" value="search" style="width: 90px">
      <input type="number" value="7" style="width: 90px"> <input style="width: 90px"> end
    </p>
  </section>

  <section>
    <h2>Focus ring (outline)</h2>
    <p><input type="radio" class="anel" checked> radio <input type="checkbox" class="anel" checked> checkbox
      <button class="anel">Button</button>
    </p>
    <p><input type="range" class="anel" value="40"> slider</p>
    <p><input class="anel" value="text field"></p>
    <p><input class="anel arredondado" value="rounded border"></p>
  </section>
</body>

</html>
