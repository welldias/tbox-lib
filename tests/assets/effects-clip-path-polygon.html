<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Polygon clips</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font: 16px sans-serif;
            color: #172033;
            background: #edf1f7;
        }

        h1 {
            font-size: 24px;
        }

        h2 {
            font-size: 17px;
            margin: 20px 0 8px;
        }

        p {
            margin: 8px 0;
        }

        .row {
            display: flex;
            gap: 16px;
            margin-bottom: 12px;
        }

        .tile {
            width: 230px;
            height: 140px;
            background: linear-gradient(45deg, #2563eb, #10b981);
        }

        .triangle {
            clip-path: polygon(50% 0, 100% 100%, 0 100%);
        }

        .concave {
            clip-path: polygon(0 0, 100% 0, 100% 30%, 30% 30%, 30% 100%, 0 100%);
        }

        .star {
            clip-path: polygon(nonzero, 50% 0, 80% 100%, 0 38%, 100% 38%, 20% 100%);
        }

        .star-hole {
            clip-path: polygon(evenodd, 50% 0, 80% 100%, 0 38%, 100% 38%, 20% 100%);
        }

        .parent {
            clip-path: polygon(0 0, 100% 0, 0 100%);
            background: none;
        }

        .child {
            width: 100%;
            height: 100%;
            background: #ef4444;
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        .filtered {
            clip-path: polygon(calc(50% - 10px) 0, 100% 100%, 0 100%);
            filter: blur(3px);
            opacity: .75;
            border-radius: 15px;
        }
    </style>
</head>

<body>
    <h1>clip-path: polygon()</h1>
    <p>Clips the element and its descendants, pointer events included.</p>
    <div class="row">
        <div><p>triangle</p><div class="tile triangle"></div></div>
        <div><p>concave polygon</p><div class="tile concave"></div></div>
        <div><p>star, nonzero</p><div class="tile star"></div></div>
    </div>
    <div class="row">
        <div><p>star, evenodd (hollow center)</p><div class="tile star-hole"></div></div>
        <div><p>nested polygons intersect</p><div class="tile parent"><div class="child"></div></div></div>
        <div><p>clipping after blur</p><div class="tile filtered"></div></div>
    </div>
</body>

</html>
