<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Trigonometria e raios radiais</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font: 16px sans-serif;
      color: #172033;
      background: #edf1f7;
    }

    h1 {
      font-size: 22px;
    }

    h2 {
      font-size: 18px;
      margin: 20px 0 8px;
    }

    p {
      margin: 6px 0;
    }

    .track {
      width: 300px;
      background: white;
      margin-bottom: 10px;
    }

    .bar {
      height: 16px;
      background: #2563eb;
    }

    .sin {
      width: calc(sin(pi / 2) * 150px);
    }

    .cos {
      width: calc(cos(60deg) * 150px);
    }

    .tan {
      width: calc(tan(.125turn) * 150px);
    }

    .row {
      display: flex;
      gap: 16px;
    }

    .card {
      width: 160px;
      height: 100px;
      border-radius: 8px;
    }

    .circle {
      background: radial-gradient(circle 40px, white, #2563eb);
    }

    .ellipse {
      background: radial-gradient(ellipse 70px 25px, white, #2563eb);
    }

    .percent {
      background: radial-gradient(50% 25% at 25% 50%, white, #2563eb);
    }

    .repeat {
      background: repeating-radial-gradient(circle 20px, white 0 10px, #2563eb 10px 20px);
    }

    .faded {
      background: #2563eb;
      opacity: cos(60deg);
    }
  </style>
</head>

<body>
  <h1>Trigonometria e raios radiais</h1>
  <h2>Resultados numéricos em comprimentos</h2>
  <p>sin(pi / 2) * 150px = 150px</p>
  <div class="track">
    <div class="bar sin"></div>
  </div>
  <p>cos(60deg) * 150px = 75px</p>
  <div class="track">
    <div class="bar cos"></div>
  </div>
  <p>tan(.125turn) * 150px = 150px</p>
  <div class="track">
    <div class="bar tan"></div>
  </div>
  <h2>Raios explícitos</h2>
  <div class="row">
    <div>
      <p>Círculo: 40px</p>
      <div class="card circle"></div>
    </div>
    <div>
      <p>Elipse: 70px × 25px</p>
      <div class="card ellipse"></div>
    </div>
    <div>
      <p>Elipse: 50% × 25%</p>
      <div class="card percent"></div>
    </div>
  </div>
  <h2>Repetição e opacidade calculada</h2>
  <div class="row">
    <div>
      <p>Repetição: 20px</p>
      <div class="card repeat"></div>
    </div>
    <div>
      <p>opacity: cos(60deg)</p>
      <div class="card faded"></div>
    </div>
  </div>
</body>

</html>
